pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenLocal {
            content {
                excludeModule('org.primefaces', 'primefaces')
            }
        }
        mavenCentral()
    }
}

rootProject.name = 'primefaces-homeoffice'
