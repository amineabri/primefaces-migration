services:
  primefaces-homeoffice:
    platform: linux/amd64
    build:
      context: .
      platforms:
        - linux/amd64
      args:
        EAP_PLATFORM: linux/amd64
    image: primefaces-homeoffice:eap-8.1-java21
    restart: "no"
    stop_grace_period: 60s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"
