<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title><ui:insert name="title">PrimeFaces Home Office Sample</ui:insert></title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <f:facet name="last">
        <link rel="stylesheet" href="#{resource['css:app.css']}"/>
    </f:facet>
</h:head>

<h:body>
    <div class="app-shell">
        <header class="app-header">
            <div class="brand-row">
                <div>
                    <span class="brand-mark">GOV.UK</span>
                    <span class="brand-name">Home Office</span>
                </div>
                <span class="brand-context">Internal Services</span>
            </div>

            <h:form id="navigationForm">
                <p:menubar styleClass="top-navigation">
                    <p:menuitem value="Home" outcome="/home" icon="pi pi-home"/>
                    <p:menuitem value="Dashboard" outcome="/dashboard" icon="pi pi-chart-line"/>
                    <p:menuitem value="Employees" outcome="/employees" icon="pi pi-user"/>
                    <p:menuitem value="Reports" outcome="/reports" icon="pi pi-file"/>
                    <p:menuitem value="Elements" outcome="/elements" icon="pi pi-cog"/>
                </p:menubar>
            </h:form>
        </header>

        <main class="content">
            <ui:insert name="content"/>
        </main>
    </div>
</h:body>
</html>
