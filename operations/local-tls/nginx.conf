log_format ops02 '$time_iso8601 status=$status method=$request_method uri=$uri '
                 'upstream=$upstream_status request_time=$request_time';
access_log /dev/stdout ops02;
server_tokens off;

server {
    listen 8081;
    server_name localhost;
    if ($host != localhost) { return 400; }
    return 308 https://localhost:8443$request_uri;
}

server {
    listen 8443 ssl;
    server_name localhost;
    if ($host != localhost) { return 400; }
    ssl_certificate /etc/nginx/local-tls/localhost.crt;
    ssl_certificate_key /etc/nginx/local-tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 10m;

    location ~ ^/(health|management|metrics)(/|$) { return 404; }
    location / {
        if (-f /tmp/maintenance) { return 503; }
        if (-f /tmp/backend-unready) { return 503; }
        resolver 127.0.0.11 valid=1s ipv6=off;
        set $backend eap:8080;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:8443;
        proxy_set_header X-Forwarded-Host localhost:8443;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded 'for="$remote_addr";proto=https;host="localhost:8443"';
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 90s;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_redirect http://localhost:8443/ https://localhost:8443/;
    }
}
