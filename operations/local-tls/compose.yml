name: ops02-local

services:
  eap:
    image: ghcr.io/amineabri/primefaces-migration@sha256:63126aa490725adbcf1f02170a251f1d0b949ddaeb6b2c574712c4d864a003fe
    platform: linux/amd64
    restart: "no"
    stop_grace_period: 60s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
  proxy:
    image: nginx@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    command: ["sh", "-c", "touch /tmp/backend-unready && exec nginx -g 'daemon off;'"]
    restart: "no"
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8081:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${OPS02_TLS_DIR:?Set OPS02_TLS_DIR to the local development certificate directory}:/etc/nginx/local-tls:ro
    networks: [backend, edge]

networks:
  backend:
    internal: true
  edge:
