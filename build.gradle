plugins {
    id 'java'
    id 'war'
}

group = 'com.example.homeoffice'
version = '1.0.0'
description = 'Jakarta EE 10 Faces application for Java 21 and JBoss EAP 8.1.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

def localPrimeFacesJar = layout.projectDirectory.file("libs/primefaces-${libs.versions.primefaces.get()}-jakarta.jar").asFile

dependencies {
    providedCompile libs.jakartaee.api
    if (localPrimeFacesJar.exists()) {
        implementation files(localPrimeFacesJar)
    } else {
        implementation(libs.primefaces) {
            artifact {
                classifier = 'jakarta'
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

war {
    archiveFileName = 'primefaces-homeoffice.war'
}
